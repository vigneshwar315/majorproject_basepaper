[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-replication"
version = "0.1.0"
description = "Reproduction of Ghiani, Manni, Zacchino (IEEE Access 2025): LLM-enhanced optimization-based decision support (VRP + DMG + MCDM)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "streamlit>=1.40",
  "plotly>=5.20",
  "google-genai>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["live: calls a real LLM provider; disabled unless RUN_LIVE_LLM_TESTS=1"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "frontend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/paper_replication/constraints.py" = ["E741"]  # l = latest bound, matching the paper's notation (e_j, l_j)
"frontend/helpers.py" = ["B023"]  # local closures are called inside the same loop iteration
